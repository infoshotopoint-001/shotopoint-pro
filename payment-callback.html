<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Verification | Shoto Point</title><style>body{font-family:Arial,sans-serif;background:#03170f;color:#f7f4ea;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(620px,calc(100% - 32px));padding:32px;border:1px solid #00d96b55;border-radius:18px;background:#07251a}.status{margin-top:18px;color:#00d96b}.button{display:inline-block;margin-top:20px;padding:12px 18px;border-radius:999px;background:#00d96b;color:#112216;text-decoration:none;font-weight:700}</style><link rel="stylesheet" href="/spp-cms-live.css"></head><body><main class="card"><h1>Payment verification</h1><p id="message">Verifying your payment securely…</p><div class="status" id="status" aria-live="polite"></div><a class="button" href="index.html">Return to Shoto Point</a><section id="sppCmsPageContent" class="spp-cms-slot" hidden></section></main><script>(()=>{const ref=new URLSearchParams(location.search).get('reference')||'';const m=document.getElementById('message'),s=document.getElementById('status');if(!ref){m.textContent='No payment reference was supplied.';return;}fetch('/api/payments/verify/'+encodeURIComponent(ref)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');return d;}).then(d=>{m.textContent=d.status==='paid'?'Payment verified successfully.':'Payment was not completed.';s.textContent='Reference: '+(d.reference||ref);}).catch(e=>{m.textContent='We could not verify this transaction yet.';s.textContent=e.message;});})();</script><script src="/spp-cms-public.js" data-spp-page="payment-callback"></script></body></html>
