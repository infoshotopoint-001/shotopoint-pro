<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoto Point System Health</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07150f;color:#fff;font:16px Arial}.box{max-width:680px;width:calc(100% - 40px);padding:30px;border:1px solid #00d96b55;border-radius:18px;background:#0d2419}h1{color:#00d96b}.status{padding:14px;border-radius:10px;background:#132d20;margin:12px 0}button{padding:10px 16px;background:#00d96b;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><link rel="stylesheet" href="/spp-cms-live.css"><link rel="stylesheet" href="spp-global-theme.css">
</head><body>
<div id="spp-global-preloader" role="status" aria-live="polite" aria-label="Loading Shoto Point Productions"><div class="spp-loader-orbit"><div class="spp-loader-mark">S<span>P</span></div></div><div class="spp-loader-title">SHOTO POINT PRODUCTIONS</div><div class="spp-loader-subtitle">STORIES · VISIONS · IMPACT</div><div class="spp-loader-track"><span></span></div></div>
<main class="box"><h1>Shoto Point System Health</h1><p>Check the Node.js API and database connectivity.</p><div class="status" id="status">Checking system…</div><button id="refresh">Check again</button><p><a style="color:#00d96b" href="index.html">Return to website</a></p><section id="sppCmsPageContent" class="spp-cms-slot" hidden></section></main><script>async function check(){const el=document.getElementById('status');el.textContent='Checking Node API and database…';try{const r=await fetch('/api/health',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'API or database unavailable');el.textContent='API online · Database '+d.database+' · MySQL '+(d.mysql?'connected':'not connected')+' · '+new Date(d.serverTime).toLocaleString();}catch(e){el.textContent='Connection failed: '+e.message+'. Start the Node.js server and verify the database settings.';}}document.getElementById('refresh').addEventListener('click',check);check();</script><script src="/spp-cms-public.js" data-spp-page="database-status"></script><script src="spp-global.js"></script>
</body></html>
